version: "3.8"

services:
  prometheus:
    image: prom/prometheus
    container_name: tbvault-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux; harmless on Windows/Mac

  grafana:
    image: grafana/grafana
    container_name: tbvault-grafana
    ports:
      - "3001:3000"
    volumes:
      # data source + the "TBVault chatbot" dashboard are set up automatically
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus