# TBVault: serves the built frontend and proxies /api to the Node API on port 3000.
# certbot (enable-https.sh) adds the HTTPS server block to this file.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/tbvault/current/frontend;
    index index.html;

    # Product image uploads: up to 6 files x 5 MB.
    client_max_body_size 35m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite puts hashed files here, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: unknown paths load the app, which shows the right page.
    location / {
        try_files $uri /index.html;
    }
}
