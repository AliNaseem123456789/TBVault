# Chatbot: proxies everything to the FastAPI app on port 8000.
# Only the TBVault backend calls it; every endpoint except /health needs the X-Internal-Key header.
# certbot (enable-https.sh) adds the HTTPS server block to this file.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Photo search uploads: one image up to 5 MB.
    client_max_body_size 6m;

    # Prometheus metrics stay private (scrape them from this server or through an SSH tunnel).
    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM answers can take a while; the backend gives up after 45 s.
        proxy_read_timeout 60s;
    }
}
